name: Publish

# Verified community nodes must be published by a workflow with a provenance
# statement — n8n stopped accepting nodes published from a developer's machine
# on 1 May 2026. The provenance proves this package was built by this workflow,
# from this repository, at this commit.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Test
        run: npm test

      # `npm run release` is the only publish path the n8n node tooling allows.
      # Inside GitHub Actions it lints, builds and publishes with provenance.
      # With no NPM_TOKEN secret set, npm uses trusted publishing (OIDC) instead.
      - name: Release
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
